services:
  frontend:
    build:
      context: frontend
    env_file:
      - frontend/.env
    volumes:
      - frontend:/app/frontend/dist

  mongo:
    image: mongo
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - db:/data/db
    ports:
      - 127.0.0.1:27018:27017
    networks:
      - internal

  backend:
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    restart: always
    build:
      context: backend
    env_file:
      - backend/.env
    environment:
      TRUSTED_PROXIES: 172.30.187.10
    volumes:
      - ./backend/src:/app/src
      - public:/app/src/public
    ports:
      - 127.0.0.1:3000:3000
    networks:
      - internal
    depends_on:
      - mongo

  server:
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    build:
      context: nginx
    ports:
      - 127.0.0.1:80:80
    volumes:
      - frontend:/var/app
      - public:/var/public
    depends_on:
      - frontend
      - backend
    networks:
      internal:
        ipv4_address: 172.30.187.10

volumes:
  frontend:
  public:
  db:

networks:
  internal:
    ipam:
      config:
        - subnet: 172.30.187.0/24
